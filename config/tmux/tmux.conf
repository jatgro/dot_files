# ---------------------------------------------
# Personal tmux config (beautified)
# - Custom prefix: C-Space
# - Catppuccin theme + directory in status-left
# - Floax floating popup plugin
# ---------------------------------------------
# set -g prefix ^b 
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
set -g status-position top
set-option -ga terminal-overrides ",xterm-256color:Tc"
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
## vim style navigation bindings 
# bind h select-pane -L
# bind j select-pane -D
# bind k select-pane -U
# bind l select-pane -R

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -n S-Left  previous-window
bind -n S-Right next-window

# Tmux-floax configurations
set -g @plugin 'omerxx/tmux-floax'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'white'
set -g @floax-text-color 'aqua'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'

# #Catpuccin theme customisation
set -g @catppuccin-tmux_show_git 0
set -g @catppuccin-tmux_pane_id_style hide 
set -g @catppuccin-tmux_zoom_id_style hide 
set -g @catppuccin-tmux_show_path 1
set -g @catppuccin-tmux_theme 'frappe'
# set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"
# --- Status Bar (custom segments) ---
# Shows: session name, current working directory (basename), prefix indicator
# Uses simple separators for a clean aesthetic with Catppuccin theme colors.
set -g status-bg colour235
set -g status-fg colour136
set -g status-left-length 60
set -g status-right-length 80
set -g status-left "#[fg=colour39,bg=colour235] 🖥️  #S #[fg=colour39,bg=colour235]│  #(\/Users\/jgrover6\/\.config\/tmux\/scripts\/truncate_path.sh \"#{pane_current_path}\" 40 --git-relative) #[fg=colour39,bg=colour235]│  #(\/Users\/jgrover6\/\.config\/tmux\/scripts\/git_branch.sh \"#{pane_current_path}\") #[bg=colour235]│#[default]"
set -g status-right "#[fg=colour39,bg=colour235]🔋  #(pmset -g batt | grep -Eo '[0-9]+%' | head -1) ⏰ %H:%M  #[fg=colour39,bg=colour235] #[default]"
set -g window-status-current-format "#[fg=colour31,bg=colour235]#[fg=colour255,bg=colour31] #I:#W #[fg=colour31,bg=colour235]"
set -g window-status-format "#[fg=colour136,bg=colour235] #I:#W "
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour39
set -g status-style "bg=#{@thm_bg}"
set -g status-justify "centre"
setw -g pane-border-status top
setw -g pane-border-format ""
setw -g pane-active-border-style "bg=#{@thm_bg},fg=#{@thm_overlay_0}"
setw -g pane-border-style "bg=#{@thm_bg},fg=#{@thm_surface_0}"
setw -g pane-border-lines single
set -wg automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"


# ---------------------------------------------
# Personal tmux config (beautified)
# - Custom prefix: C-Space
# - Catppuccin theme + directory in status-left
# - Floax floating popup plugin
# ---------------------------------------------
# set -g prefix ^b
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix
set -g status-position top
set-option -ga terminal-overrides ",xterm-256color:Tc"
set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Vi mode for copy mode (enables /, ?, n, N for searching)
setw -g mode-keys vi
## vim style navigation bindings
# bind h select-pane -L
# bind j select-pane -D
# bind k select-pane -U
# bind l select-pane -R

bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -n S-Left  previous-window
bind -n S-Right next-window

# Tmux-floax configurations
set -g @plugin 'omerxx/tmux-floax'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'white'
set -g @floax-text-color 'aqua'
set -g @floax-bind 'p'
set -g @floax-change-path 'true'

# #Catpuccin theme customisation
set -g @catppuccin-tmux_show_git 0
set -g @catppuccin-tmux_pane_id_style hide
set -g @catppuccin-tmux_zoom_id_style hide
set -g @catppuccin-tmux_show_path 1
# NOTE: @catppuccin-tmux_theme is the deprecated fork's name (ignored by catppuccin/tmux).
# The current plugin uses @catppuccin_flavor:
set -g @catppuccin_flavor 'frappe'
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "none"
set -g @catppuccin_pane_status_enabled "off"
set -g @catppuccin_pane_border_status "off"
# --- Status Bar (Catppuccin Frappé · powerline) ---
# Shows: session name, current working directory, git branch, battery, clock
# All colors derive from the Catppuccin Frappé palette (#{@thm_*} variables).
set -g status-style "bg=#{@thm_bg}"
set -g status-justify "centre"
set -g status-left-length 120
set -g status-right-length 120
set -g window-status-separator ""

# Left:   session  ›  path  ›  git
set -g status-left "#[fg=#{@thm_crust},bg=#{@thm_mauve},bold]  #S #[fg=#{@thm_mauve},bg=#{@thm_surface_0}]#[fg=#{@thm_fg},bg=#{@thm_surface_0}]  #(/Users/jgrover6/.config/tmux/scripts/truncate_path.sh \"#{pane_current_path}\" 40 --git-relative) #[fg=#{@thm_surface_0},bg=#{@thm_bg}]#[fg=#{@thm_green},bg=#{@thm_bg}]  #(/Users/jgrover6/.config/tmux/scripts/git_branch.sh \"#{pane_current_path}\") "

# Right:  battery  ‹  clock
set -g status-right "#[fg=#{@thm_surface_0},bg=#{@thm_bg}]#[fg=#{@thm_fg},bg=#{@thm_surface_0}]  #(pmset -g batt | grep -Eo '[0-9]+%' | head -1) #[fg=#{@thm_blue},bg=#{@thm_surface_0}]#[fg=#{@thm_crust},bg=#{@thm_blue},bold]  %H:%M "

# Window tabs (powerline)
set -g window-status-current-format "#[fg=#{@thm_peach},bg=#{@thm_bg}]#[fg=#{@thm_crust},bg=#{@thm_peach},bold] #I:#W #[fg=#{@thm_peach},bg=#{@thm_bg}]"
set -g window-status-format "#[fg=#{@thm_overlay_0},bg=#{@thm_bg}]  #I:#W "

# Pane borders (Frappé)
setw -g pane-border-status top
setw -g pane-border-format ""
setw -g pane-active-border-style "bg=#{@thm_bg},fg=#{@thm_overlay_0}"
setw -g pane-border-style "bg=#{@thm_bg},fg=#{@thm_surface_0}"
setw -g pane-border-lines single
set -wg automatic-rename on
set -g automatic-rename-format "#{pane_current_command}"

# Catpuccin config 2 ommerx fork
# set -g @catppuccin_window_left_separator ""
# set -g @catppuccin_window_right_separator ""
# set -g @catppuccin_window_middle_separator " █"
# set -g @catppuccin_window_number_position "right"
# set -g @catppuccin_window_default_fill "number"
# set -g @catppuccin_window_default_text "#W"
# set -g @catppuccin_window_current_fill "number"
# set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"
# set -g @catppuccin_status_modules_right "directory date_time"
# set -g @catppuccin_status_modules_left "session"
# set -g @catppuccin_status_left_separator  " "
# set -g @catppuccin_status_right_separator " "
# set -g @catppuccin_status_right_separator_inverse "no"
# set -g @catppuccin_status_fill "icon"
# set -g @catppuccin_status_connect_separator "no"
# set -g @catppuccin_directory_text "#{b:pane_current_path}"
# set -g @catppuccin_meetings_text "#($HOME/.config/tmux/scripts/cal.sh)"
# set -g @catppuccin_date_time_text "%H:%M"

set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Restore Vim/Neovim sessions when Session.vim exists
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# Optional: preserve visible/full terminal output
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-pane-contents-area 'visible'


# Optional: use alternative keys
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

run '~/.config/tmux/plugins/tpm/tpm'
